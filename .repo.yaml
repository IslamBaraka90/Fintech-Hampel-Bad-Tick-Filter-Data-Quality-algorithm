# Split model: reader keeps the teaching snippet; this repo owns the production
# filter plus the AUDIT surface (compare_modes, lookahead_cost, threshold_sweep,
# flagged_report). Chosen because `mode="centered"` is the algorithm's one genuine
# production hazard — it reads k observations ahead, so using it for backtest
# features silently injects look-ahead bias. The audit surface turns the per-point
# `lookahead_used` flag into an answer to "which flags would I have had live?".
# Note: no streaming engine — a causal Hampel window IS bounded and could stream,
# but the interesting axis here is the mode/threshold decision, not throughput.
# No Yahoo path: the value of the fixture is its DELIBERATELY corrupt ticks.
model: "split"
